name: Generate Contribution Snake

on:
  schedule:
    # Refresh once a day, a few minutes off the hour to avoid GitHub's cron peak.
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Only needs the automatic per-run token to push the generated SVGs to the
# `output` branch. No repository secrets are required.
permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Render and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Light variant is the primary one: GitHub's light-mode empty-cell grey
          # plus a blue contribution ramp that matches the README accent.
          outputs: |
            dist/github-snake.svg?color_snake=#0969da&color_dots=#ebedf0,#c6e2ff,#7cb9ff,#3b82f6,#0a4da8
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
